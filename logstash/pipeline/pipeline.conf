input {

 file {
   type => "json"
   codec => "json"
   path => "/home/tracking/*.log"
   start_position => beginning
   sincedb_path =>"/usr/share/logstash/data/plugins/inputs/file/.sincedb_render_time_per_frame"
   add_field => { "source" => "render" }
 }

 file {
   type => "json"
   codec => "json"
   path => "/home/plugin/*.log"
   start_position => beginning
    sincedb_path =>"/usr/share/logstash/data/plugins/inputs/file/.sincedb_qgis_server_index"
    add_field => { "source" => "qgis" }
 }

  file {
    path => "/home/apache/ws.dataosm-customlog"
    start_position => "beginning"
    start_position => beginning
    sincedb_path =>"/usr/share/logstash/data/plugins/inputs/file/.sincedb_apache_download"
    add_field => { "source" => "apache_download" }
  }

}

filter {
  
  if [source] == "qgis" {
    date {
      match => ["RESPONSE_DATE", "yyyy-MM-dd HH:mm:ss"]
      target => "RESPONSE_DATE"
    }
  }if [source] == "render" {
    date {
      match => ["response_date_time", "yyyy-MM-dd HH:mm:ss"]
      target => "response_date_time"
    }
  }

  if [source]=="apache_download"{

    grok {
      match => {
        "message" => '%{IPORHOST:clientip} - - \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:httpversion}" %{NUMBER:response} (?:%{NUMBER:bytes}|-) "%{URI:referrer}" "%{GREEDYDATA:useragent}"'
      }
    }

    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }

    if "download" not in [request] {
        drop { }
    }
    
    mutate {
      remove_field => [ "clientip", "message" ]
    }

  }
}

output {
  if [source] == "qgis" {
    elasticsearch {
       hosts => ["elastic:9200"]
       index => "qgis-server-index"
   }
  } else if [source] == "render" {
    elasticsearch {
       hosts => ["elastic:9200"]
       index => "render-time-per-frame"
    }
  }
  else if [source] == "apache_download" {

    elasticsearch {
       hosts => ["elastic:9200"]
       index => "download"
    }
  }

   stdout { codec => rubydebug }
   
}

